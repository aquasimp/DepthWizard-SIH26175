# Smoke test configuration for metric nDSM head fine-tuning
model:
  encoder: "vits"
  features: 64
  checkpoint: "models/depth_anything_v2_vits.pth"
  freeze_encoder: true

data:
  manifest: "data/gamus/smoke_manifest.csv"
  max_samples: 20
  crop_size: 518
  batch_size: 2
  num_workers: 0
  augment: false

training:
  epochs: 10
  lr: 0.0005
  weight_decay: 0.0001
  warmup_ratio: 0.05
  output_checkpoint: "models/dav2s_gamus_ft_v1.pth"
  loss:
    silog_lambda: 0.85
    silog_eps: 0.0001
    l1_weight: 0.5
    grad_weight: 0.5
