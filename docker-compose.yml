services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: depthwizard-backend
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - OPENTOPO_API_KEY=${OPENTOPO_API_KEY:-}
      - DEVICE=cuda
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - ./models:/app/models:ro
      - ./jobs:/app/jobs:rw
      - ./data/cache:/app/data/cache:rw
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: depthwizard-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
