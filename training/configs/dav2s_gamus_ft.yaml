# Full fine-tuning configuration on GAMUS subset
run_name: "dav2s_gamus_ft_v1"
# Capped from original targets (~600 train / 120 val) due to hackathon-window bandwidth limits during ingestion
max_train_tiles: 40
max_val_tiles: 16
epochs: 30
batch_size: 8
crop_size: 518
learning_rate: 0.00003
min_lr: 0.000003
warmup_ratio: 0.05
weight_decay: 0.01
grad_clip: 1.0
amp: false
device: "auto"
seed: 42
checkpoint_interval_steps: 25
output_checkpoint: "models/dav2s_gamus_ft_v1.pth"
