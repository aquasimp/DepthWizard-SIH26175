[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "depthwizard"
version = "1.0.0"
description = "Single-View Height Estimation and 3D Flythrough (ISRO / SAC SIH 2026 Problem Statement 26175)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "rasterio>=1.3.9",
    "pyproj>=3.6.1",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "scikit-image>=0.22.0",
    "trimesh>=4.0.0",
    "pygltflib>=1.16.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pillow>=10.2.0",
    "requests>=2.31.0",
    "h5py>=3.10.0",
    "huggingface-hub>=0.21.0",
    "matplotlib>=3.8.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-requests>=2.31.0",
    "types-Pillow>=10.2.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["depthwizard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "node_modules",
    "frontend",
    "jobs",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "E741", "E402"]

[tool.mypy]
python_version = "3.11"
packages = ["depthwizard"]
mypy_path = "backend"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "frontend/",
    "node_modules/",
    ".venv/",
    "jobs/",
]
