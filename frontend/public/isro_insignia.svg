<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Technical Reticle Ring -->
  <circle cx="32" cy="32" r="30" stroke="#0055A5" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2 3"/>
  <circle cx="32" cy="32" r="26" stroke="#00C2CB" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Cardinal Crosshair Ticks -->
  <line x1="32" y1="2" x2="32" y2="7" stroke="#FF6E14" stroke-width="2"/>
  <line x1="32" y1="57" x2="32" y2="62" stroke="#FF6E14" stroke-width="2"/>
  <line x1="2" y1="32" x2="7" y2="32" stroke="#00C2CB" stroke-width="2"/>
  <line x1="57" y1="32" x2="62" y2="32" stroke="#00C2CB" stroke-width="2"/>
  <!-- Orbital Arc -->
  <path d="M12 40 C 16 18, 44 14, 52 28 C 55 34, 50 48, 30 50" stroke="#00C2CB" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 2"/>
  <!-- ISRO Launch Trajectory Curve (Saffron Plume) -->
  <path d="M18 48 C 22 42, 28 34, 38 24" stroke="#FF6E14" stroke-width="3" stroke-linecap="round"/>
  <path d="M16 50 C 20 45, 26 38, 34 30" stroke="#FFA726" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- Satellite / Ascending Vector Arrowhead -->
  <polygon points="38,20 48,22 42,32 37,27" fill="#FFFFFF"/>
  <polygon points="40,22 46,23 43,29 39,26" fill="#0055A5"/>
  <!-- Solar Panels -->
  <line x1="45" y1="18" x2="51" y2="13" stroke="#00C2CB" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="39" y1="33" x2="33" y2="39" stroke="#00C2CB" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Central Earth Geoid Core -->
  <circle cx="27" cy="35" r="7" fill="#071739" stroke="#0055A5" stroke-width="1.5"/>
  <circle cx="27" cy="35" r="4" fill="#00C2CB" fill-opacity="0.4"/>
</svg>
